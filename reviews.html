<style>
/* Layout: one phone screen, deep can-blue ground, two cans side by side as the buttons */
:root {
  --ink: #142463;        /* deepest can blue */
  --blue: #1d3aa6;       /* Original can blue */
  --leaf: #3f6bd1;       /* leaf pattern blue */
  --mint: #7fe0e6;       /* PURE lettering cyan */
  --paper: #ffffff;
  --mist: #c9d4f3;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% 0%, var(--blue) 0%, var(--ink) 70%) var(--ink);
  color: var(--paper);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 32px;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
header { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.brand { font-family: var(--display); font-weight: 900; font-size: 1.05rem; letter-spacing: .22em; color: var(--mist); }
h1 { font-family: var(--display); font-weight: 900; font-size: clamp(2.4rem, 11vw, 3.4rem); line-height: .92; margin: 0; text-transform: uppercase; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--mist); font-size: 1rem; line-height: 1.45; }
.cans { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.can {
  display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
  background: var(--paper); border-radius: 22px; overflow: hidden;
  box-shadow: 0 14px 34px rgba(5, 12, 45, .45);
  transition: transform .18s ease, box-shadow .18s ease;
  -webkit-tap-highlight-color: transparent;
}
.can:active { transform: scale(.97); }
.can:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
@media (hover: hover) { .can:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(5,12,45,.55); } }
.can img { display: block; width: 100%; max-width: 100%; aspect-ratio: 430 / 760; object-fit: cover; object-position: center 40%; background: #e7e7e7; }
.label { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px 14px; }
.name { font-family: var(--display); font-weight: 900; font-size: 1.6rem; line-height: 1; text-transform: uppercase; }
.pure .name { color: #2a9aa4; }
.orig .name { color: var(--blue); }
.facts { font-size: .8rem; color: #4b5578; }
.go { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--ink); color: var(--paper); border-radius: 999px; padding: 10px 8px;
  font-weight: 700; font-size: .92rem; }
.pure .go { background: #1f7f88; }
.go svg { width: 16px; height: 16px; flex: none; }
.stars { text-align: center; color: var(--mint); font-size: 1.3rem; letter-spacing: .3em; }
footer { text-align: center; color: var(--mist); font-size: .85rem; line-height: 1.5; }
footer b { color: var(--paper); }
@media (prefers-reduced-motion: reduce) { .can { transition: none; } }
</style>
